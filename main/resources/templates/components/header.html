<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header">
    <div class="header-container">
        <a class="header-logo" th:href="@{/}"><img th:src="@{/assets/logo.svg}" alt="ДостоRead — главная"></a>
        <nav aria-label="Основная навигация">
            <ul>
                <li><a th:href="@{/}">Главная</a></li>
                <li sec:authorize="isAnonymous()"><a th:href="@{/login}">Вход в аккаунт</a></li>
                <li sec:authorize="isAuthenticated()"><span class="header-username" sec:authentication="name"></span></li>
                <li sec:authorize="isAuthenticated()">
                    <form class="header-logout" method="post" th:action="@{/logout}">
                        <button type="submit">Выйти</button>
                    </form>
                </li>
            </ul>
        </nav>
    </div>
</header>
</body>
</html>
