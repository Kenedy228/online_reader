<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{library/shared :: head('Карточка книги')}"></head>
<body>
<a class="skip-link" href="#main">К содержимому</a>
<header th:replace="~{components/header :: header}"></header>
<main id="main" class="library" tabindex="-1">
    <a th:href="@{/library}">Моя библиотека</a>
    <h1 th:text="${book.title}"></h1>
    <dl th:replace="~{library/shared :: metadata(${book})}"></dl>
    <div class="actions">
        <a th:if="${book.ready()}" th:href="@{/library/books/{id}/notes(id=${book.id})}">Заметки книги</a>
        <a th:if="${book.ready()}" th:href="@{/library/books/{id}/read(id=${book.id})}">Читать книгу</a>
        <a th:if="${book.ready()}" th:href="@{/library/books/{id}/download(id=${book.id})}">Скачать исходник</a>
        <a th:if="${book.ready()}" th:href="@{/library/books/{id}/edit(id=${book.id})}">Изменить название и автора</a>
        <a th:href="@{/library/books/{id}/delete(id=${book.id})}">Удалить книгу</a>
    </div>
</main></body></html>
