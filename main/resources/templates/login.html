<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Курсовая работа студентов группы БО231ИСТ Журавлева Д.В. и Наумова С.А. по дисциплине информационные WEB-системы." />
    <meta name="author" content="Журавлев Д.В. и Наумов С.А." />
    <meta name="viewport"
          content="width=device-width, usescalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" type="text/css" th:href="@{styles/styles.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{styles/header.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{styles/login.css}" />

    <title>ДостоRead - вход в аккаунт</title>
</head>
<body>
<div th:replace="~{components/header :: header}"></div>

<section class="main-section">
    <div class="main-container">
        <h1 th:text="${pageTitle}"></h1>

        <form class="login-form" method="post" th:action="@{/login}" th:object="${user}">
            <label for="username">Имя пользователя: <input type="text" name="username" id="username" th:field="*{username}"/></label>
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" th:errorclass="err_text"></p>

            <label for="password">Пароль: <input type="password" name="password" id="password" th:field="*{password}"/></label>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" th:errorclass="err_text" ></p>

            <div class="show_hide_password_container">
                <p class="show_hide_password_text">Показать пароль:</p>
                <input src="assets/hide.png" alt="картинка показать пароль" type="image" class="show_hide_passwrd" data-status="hide"/>
            </div>
            <input type="submit" th:value="Войти" class="submit_btn">
            <p class="to_registration">Если у вас нет аккаунта, <a th:href="@{registration}">зарегистрируйте</a> его прямо сейчас!</p>
        </form>

    </div>
</section>

<script src="js/passwordVisibilityChangerForLogin.bundle.js" type="module"></script>
</body>
</html>
