<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Курсовая работа студентов группы БО231ИСТ Журавлева Д.В. и Наумова С.А. по дисциплине информационные WEB-системы." />
    <meta name="author" content="Журавлев Д.В. и Наумов С.А." />
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" type="text/css" th:href="@{styles/styles.css}"/>
    <link rel="stylesheet" type="text/css" th:href="@{styles/header.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{styles/index.css}" />
    <title>ДостоRead - курсовая работа</title>
</head>
<body>
    <div th:replace="~{components/header :: header}"></div>
    <section class="main-1-section">
        <div class="main-1-container">
            <h1 th:text="${title}"></h1>
            <div class="about-project">
                <p class="about-project-text" th:text="${aboutProject}"></p>
                <p class="goals">Основные функции проекта</p>
                <div class="goals-container">
                    <div class="uno-goal-container" th:each="goal : ${goals}">
                        <img src="assets/goal.png" alt="галочка">
                        <p th:text="${goal}"></p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
