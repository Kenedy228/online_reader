<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{library/shared :: head('Изменить заметку')}"></head>
<body><a class="skip-link" href="#main">К содержимому</a><header th:replace="~{components/header :: header}"></header>
<main id="main" class="library" tabindex="-1">
    <h1>Изменить заметку</h1><h2 th:text="${book.title}"></h2><nav th:replace="~{notes/shared :: navigation(${book})}"></nav>
    <form method="post" th:action="@{/library/books/{id}/notes/{noteId}/edit(id=${book.id},noteId=${current.id})}" th:object="${edit}" th:attr="data-unsaved=${#fields.hasAnyErrors()}">
        <div th:replace="~{notes/shared :: errors}"></div><input type="hidden" name="version" th:value="${edit.version}">
        <th:block th:replace="~{notes/shared :: editor(${edit.text})}"></th:block>
        <div class="current-values"><h2>Сейчас сохранено</h2><p class="note-text" th:text="${current.text}"></p></div>
        <p>Привязка к месту в книге сохраняется.</p>
        <div class="actions"><button type="submit">Сохранить изменения</button><a th:href="@{/library/books/{id}/notes/{noteId}(id=${book.id},noteId=${current.id})}">Отмена</a></div>
    </form>
</main></body></html>
