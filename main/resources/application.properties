spring.application.name=online_reader
# Runtime profile must be selected explicitly: local, test, production.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:5000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:1000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

debug=false
trace=false
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.tomcat.connection-timeout=${HTTP_CONNECTION_TIMEOUT:10s}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

spring.mail.protocol=smtp
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=
spring.mail.password=
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:3000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:3000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:3000}

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:11MB}

# One schema owner: Flyway migrates before Hibernate validates.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# Session authentication: cookie-only, no trusted forwarded headers in this local baseline.
server.servlet.session.timeout=${SESSION_TIMEOUT:15m}
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false
server.forward-headers-strategy=none
online-reader.auth.max-attempts=${LOGIN_MAX_ATTEMPTS:10}
online-reader.auth.max-clients=${LOGIN_MAX_CLIENTS:1024}
online-reader.auth.window=${LOGIN_WINDOW:60s}
online-reader.registration.max-attempts=${REGISTRATION_MAX_ATTEMPTS:5}
online-reader.registration.max-clients=${REGISTRATION_MAX_CLIENTS:1024}
online-reader.registration.window=${REGISTRATION_WINDOW:60s}

# A fixed, sanitized application error endpoint; never fall back to whitelabel output.
server.error.path=/error
server.error.whitelabel.enabled=false
