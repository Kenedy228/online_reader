spring.datasource.url=jdbc:h2:mem:online_reader_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Test contexts must never contact the configured external SMTP service.
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.test-connection=false

spring.jpa.show-sql=false
server.address=127.0.0.1
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.mail.protocol=smtp
spring.sql.init.mode=never
spring.flyway.enabled=false
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.servlet.session.persistent=false
server.servlet.session.timeout=15m
server.forward-headers-strategy=none

# A fixed, sanitized application error endpoint; never fall back to whitelabel output.
server.error.path=/error
server.error.whitelabel.enabled=false
